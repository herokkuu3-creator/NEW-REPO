name: Codeforces browser submission

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      job_id:
        description: Optional Render job ID; leave empty to claim the waiting job
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: codeforces-browser
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CODEFORCES_SUBMITTER_URL: https://codeforces-submit-browser.onrender.com
      CODEFORCES_SUBMITTER_TOKEN: ${{ secrets.CODEFORCES_SUBMITTER_TOKEN }}
      HEADLESS: 'false'
      # Decorative assets are blocked; Codeforces and Cloudflare verification
      # resources remain available. This keeps residential-proxy data low.
      CODEFORCES_BLOCK_ASSETS: 'true'
      CODEFORCES_BROWSER: chromium
      # The Telegram-selected route is read from the Render job before this
      # runner joins Tailscale. Both routes remain available as explicit choices.
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      TAILSCALE_EXIT_NODE: ${{ vars.TAILSCALE_EXIT_NODE }}
      FALLBACK_CODEFORCES_PROXY: ${{ secrets.CODEFORCES_RESIDENTIAL_PROXY }}
      CODEFORCES_INPUT_JOB_ID: ${{ inputs.job_id }}
    steps:
      - name: Find waiting browser job
        id: lookup
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const base = process.env.CODEFORCES_SUBMITTER_URL;
          const requested = process.env.CODEFORCES_INPUT_JOB_ID;
          const lookupUrl = requested ? `${base}/jobs/${requested}/network` : `${base}/jobs/next`;
          fetch(lookupUrl, {
            headers: { authorization: `Bearer ${process.env.CODEFORCES_SUBMITTER_TOKEN}` },
            signal: AbortSignal.timeout(30000),
          }).then(async response => {
            if (!response.ok) throw new Error(`Render job lookup failed: HTTP ${response.status}`);
            const body = await response.json();
            const jobId = requested || body.jobId;
            if (jobId) {
              if (!/^[a-f0-9-]{36}$/.test(jobId)) throw new Error('invalid broker job id');
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `job_id=${jobId}\n`);
              const networkMode = body.networkMode;
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `network_mode=${networkMode === 'tailscale' ? 'tailscale' : 'proxy'}\n`);
            }
          }).catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
      - uses: actions/checkout@v4
        if: inputs.job_id != '' || steps.lookup.outputs.job_id != ''
      - uses: actions/setup-node@v4
        if: inputs.job_id != '' || steps.lookup.outputs.job_id != ''
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        if: inputs.job_id != '' || steps.lookup.outputs.job_id != ''
      - run: npx playwright install --with-deps chromium
        if: inputs.job_id != '' || steps.lookup.outputs.job_id != ''
      - run: npm run build
        if: inputs.job_id != '' || steps.lookup.outputs.job_id != ''
      # Connect only after all large downloads finish. Phone/proxy traffic is
      # then limited to the small Codeforces browser session itself.
      - name: Connect to phone network
        id: tailscale
        if: (inputs.job_id != '' || steps.lookup.outputs.job_id != '') && steps.lookup.outputs.network_mode == 'tailscale' && env.TAILSCALE_AUTHKEY != '' && env.TAILSCALE_EXIT_NODE != ''
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Proxy rotation cache
        if: inputs.job_id != '' || steps.lookup.outputs.job_id != ''
        uses: actions/cache@v4
        with:
          path: .proxy_state
          key: codeforces-proxy-state-${{ github.run_id }}
          restore-keys: |
            codeforces-proxy-state-
      - name: Select Codeforces network route
        if: inputs.job_id != '' || steps.lookup.outputs.job_id != ''
        env:
          TAILSCALE_STEP_OUTCOME: ${{ steps.tailscale.outcome }}
          CODEFORCES_NETWORK_MODE: ${{ steps.lookup.outputs.network_mode }}
          FALLBACK_CODEFORCES_PROXY: ${{ secrets.CODEFORCES_RESIDENTIAL_PROXY }}
        run: |
          if [ "$CODEFORCES_NETWORK_MODE" = "tailscale" ] && [ "$TAILSCALE_STEP_OUTCOME" = "success" ] && [ -n "$TAILSCALE_EXIT_NODE" ] && sudo tailscale set --exit-node="$TAILSCALE_EXIT_NODE" && timeout 30 curl --fail --silent --show-error --output /dev/null https://www.cloudflare.com/cdn-cgi/trace; then
            echo 'CODEFORCES_PROXY=' >> "$GITHUB_ENV"
            echo 'Codeforces browser will use the Android Tailscale exit node.'
          else
            sudo tailscale set --exit-node= 2>/dev/null || true
            if [ "$CODEFORCES_NETWORK_MODE" = "tailscale" ]; then
              echo 'Tailscale was selected, but the phone exit node is unavailable.' >&2
              exit 1
            fi
            node dist/src/codeforces/proxyRotator.js
          fi
      - name: Submit once and return browser result
        if: inputs.job_id != '' || steps.lookup.outputs.job_id != ''
        env:
          CODEFORCES_JOB_ID: ${{ inputs.job_id || steps.lookup.outputs.job_id }}
        run: xvfb-run -a node --expose-gc dist/src/codeforces/actionRunner.js
