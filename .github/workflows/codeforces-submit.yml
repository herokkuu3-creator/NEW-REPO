name: Codeforces browser submission

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Opaque Render job ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: codeforces-browser
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CODEFORCES_JOB_ID: ${{ inputs.job_id }}
      CODEFORCES_SUBMITTER_URL: https://codeforces-submit-browser.onrender.com
      CODEFORCES_SUBMITTER_TOKEN: ${{ secrets.CODEFORCES_SUBMITTER_TOKEN }}
      HEADLESS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - run: npm run build
      - name: Submit once and return browser result
        run: node --expose-gc dist/src/codeforces/actionRunner.js
