# Local development stack: PostgreSQL + the worker.
# Usage:
#   docker compose up db -d          # database only (for local npm dev)
#   docker compose up --build        # full stack
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leetcode
      POSTGRES_PASSWORD: leetcode
      POSTGRES_DB: leetcode_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leetcode -d leetcode_agent"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://leetcode:leetcode@db:5432/leetcode_agent
      BROWSER_PROFILE_PATH: /var/data/browser-profile
      STORAGE_STATE_PATH: /var/data/storage-state.json
      DIAGNOSTICS_DIR: /var/data/diagnostics
      HEADLESS: "true"
      DAILY_RUN_HOUR: "9"
      DAILY_RUN_MINUTE: "0"
      TIMEZONE: Asia/Kolkata
      RUN_ON_BOOT: "false"
      LEETCODE_LANGUAGE: cpp
      AUTO_SUBMIT: "false"
      SOLUTION_SOURCE: walkccc
      TRANSPORT: api
      # Only needed when SOLUTION_SOURCE=llm:
      LLM_PROVIDER: gemini
      LLM_MODEL: gemini-3.5-flash
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_COMMANDS: ${TELEGRAM_COMMANDS:-true}
      SETUP_TOKEN: ${SETUP_TOKEN:-local-dev-token}
      PORT: "3001"
      LOG_LEVEL: info
    volumes:
      - browserdata:/var/data
    # Exposed on localhost only, for your own health checks.
    ports:
      - "127.0.0.1:3001:3001"

volumes:
  pgdata:
  browserdata:
